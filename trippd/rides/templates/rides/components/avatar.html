{% if user.profile.profile_picture %}
  <div class="avatar">
    <div class="{{ style|default:'w-9 rounded-full' }}">
      <img src="{{ user.profile.profile_picture.url }}" alt="" />
    </div>
  </div>
{% else %}
  <div class="avatar">
    <div class="{{ style|default:'w-9 rounded-full' }}">
      <img src="https://ui-avatars.com/api/?name={{ user.username }}" alt="Default Profile" />
    </div>
  </div>
{% endif %}
