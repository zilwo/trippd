<div class="indicator">
  <span class="indicator-item badge badge-secondary mt-2 {% if not request.user.get_unread_notification_count %}hidden{% endif %}" id="notification-count">{{ request.user.get_unread_notification_count }}</span>
  <button class="btn btn-ghost btn-circle" popovertarget="popover-1" style="anchor-name:--anchor-1" hx-get="{% url 'notifications' %}" hx-target=".notification-list" hx-swap="innerHTML">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
      <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0" />
    </svg>
  </button>
</div>

<ul class="dropdown menu w-96 rounded-box bg-(--card) shadow-sm notification-list" popover id="popover-1" style="position-anchor:--anchor-1">
  {% include 'rides/partials/notification_list.html' %}
</ul>
