<div x-data="{ mapOpen: false }" class="inline-block  mb-6 max-w-6xl ">
  <button type="button" @click="mapOpen = true"
    class="inline-flex items-center gap-2 bg-(--card) rounded-full border border-(--blue-border) shadow-sm pl-3 pr-4 py-2 text-left">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
  <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
  <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z" />
</svg>

    <span class="text-xs text-base-content/50">View map ›</span>
  </button>

  <div x-show="mapOpen" x-cloak @keydown.escape.window="mapOpen = false"
    class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4" @click.self="mapOpen = false">
    <div class="bg-(--card) rounded-2xl shadow-2xl border border-(--blue-border) w-full max-w-2xl overflow-hidden">
      <div class="flex items-center justify-between p-4 border-b border-(--blue-border)">
        <span class="font-bold truncate">{{ place.name }}</span>
        <div class="flex items-center gap-2 shrink-0">
          <a href="https://www.google.com/maps/place/?q=place_id:{{ place.place_id }}" target="_blank" rel="noopener noreferrer"
            class="btn btn-sm rounded-full bg-(--blue) text-white border-0">View in Maps</a>
          <button class="btn btn-sm btn-circle" @click="mapOpen = false">✕</button>
        </div>
      </div>
      <template x-if="mapOpen">
        <iframe src="https://www.google.com/maps/embed/v1/place?key={{ GOOGLE_MAP_API_KEY }}&q=place_id:{{ place.place_id }}"
          class="w-full h-[400px]" style="border:0" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
      </template>
    </div>
  </div>
</div>
