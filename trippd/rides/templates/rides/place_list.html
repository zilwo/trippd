{% extends 'rides/base.html' %}

{% block content %}
  <div class="max-w-6xl mx-auto px-6 py-8">
    <div class="mb-8">
      <h1 class="text-3xl font-bold">Search Results</h1>

      <p class="text-base-content/70 mt-2">"{{ query }}" in {{ place.name }}</p>
    </div>

    {% if places %}
      <div class="grid gap-6 md:grid-cols-2 lg:grid-cols-3">
        {% for p in places %}
          {% include 'rides/partials/place_card.html' with place=p %}
        {% endfor %}
      </div>
    {% else %}
      <div class="hero bg-base-200 rounded-xl">
        <div class="hero-content text-center py-16">
          <div>
            <h2 class="text-2xl font-bold">No results found</h2>

            <p class="text-base-content/70 mt-2">Try another search.</p>
          </div>
        </div>
      </div>
    {% endif %}
  </div>
{% endblock %}
