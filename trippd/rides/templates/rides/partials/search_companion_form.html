<form method="GET" class="w-full max-w-3xl" id="trip-search-form" hx-get="{% url urlmode %}" hx-target=".trip-results" hx-swap="innerHTML" hx-trigger="input delay:500ms" hx-include="#filter-form" hx-push-url="true">
  <div class="w-full max-w-3xl">
    <div class="search-bar">
      <div class="sf max-w-full" id="sf-from-wrap">
        <div class="sf-label">To</div>
        <input class="sf-input" id="sf-to" type="text" placeholder="Going to…" autocomplete="off" name="destination" />
      </div>

      <button class="sf hover:bg-(--card2) search-btn" type="button" style="border-right: 0;  border-radius: 0 16px 16px 0;">Search</button>

      <label for="trip-filters" class="btn drawer-button bg-(--card) h-full lg:hidden hover:bg-(--card2)! flex flex-col justify-center p-6" style="border-right: 0;  border-radius: 0 16px 16px 0;">Filters</label>
    </div>
  </div>
  <div class="flex justify-center gap-2 mt-4">
    <div class="flex gap-2">
      {% for tag in popular_tags %}
        <label><input type="checkbox" name="tag" value="{{ tag }}" class="peer hidden" /><span class="btn btn-sm rounded-2xl peer-checked:bg-(--blue)">{{ tag|title }}</span></label>
      {% endfor %}
    </div>
  </div>
</form>
