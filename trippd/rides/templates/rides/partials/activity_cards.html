{% load ride_tags %}

<div class="flex justify-between items-center mb-4 gap-3">
  <h2 class="text-xl sm:text-3xl font-bold">Activities Near</h2>
  <a href="{% url 'place_section_list' place.pk section %}" class="link link-primary">View all</a>
</div>

{% if activities %}
  <div class="grid gap-3 sm:gap-6 grid-cols-2 lg:grid-cols-4">
    {% for activity in activities %}
      {% include 'rides/partials/activity_card.html' with activity=activity %}
    {% endfor %}
  </div>
{% else %}
  <div class="hero bg-base-200 rounded-2xl">
    <div class="hero-content py-10 sm:py-16 px-4 text-center">
      <div class="text-center">
        <h2 class="text-lg sm:text-2xl font-bold">No activities yet</h2>
        <p class="py-2 text-base-content/70">Be the first to organize one.</p>
      </div>
    </div>
  </div>
{% endif %}
