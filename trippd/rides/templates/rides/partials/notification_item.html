<div class="flex" id="notification-item-{{ notification.id }}">
  <a href="{% url 'notification_redirect' notification.id %}" class="flex gap-3 p-4 hover:bg-(--card2)">
    {% if not notification.isread %}
      <div class="mt-2">
        <div class="mt-2">
          <div class="w-2 h-2 rounded-full bg-(--blue)"></div>
        </div>
      </div>
    {% endif %}

    <div class="flex flex-col">
      <p class="text-sm">{{ notification.text }}</p>
      <p class="text-xs text-base-content/60 mt-1">{{ notification.created_at|timesince }} ago</p>
    </div>
  </a>
  {% if not notification.isread %}
    <div hx-post="{% url 'mark_notification_read' notification.id %}" hx-target="#notification-item-{{ notification.id }}" hx-swap="outerHTML" class="flex items-center justify-center">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
      </svg>
    </div>
  {% endif %}
</div>
